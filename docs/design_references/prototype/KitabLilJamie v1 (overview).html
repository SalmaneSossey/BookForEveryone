<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KitabLilJamie — Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #EFEAE0; font-family: 'Geist', system-ui, sans-serif; color: #1B1A17; }
    body { min-height: 100vh; overflow: hidden; }
    * { box-sizing: border-box; }
    h1, h2, h3, p { margin: 0; }
    button { font-family: inherit; }
    /* italic from Geist isn't available — emulate with skew on .italic if needed */
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="samia"
            title="Module 01 · Samia"
            subtitle="Pour les personnes mal-voyantes. Bibliothèque audio + assistant vocal en darija, arabe et français."
          >
            <DCArtboard id="s1" label="A · Accueil"        width={360} height={740}><S1_Home /></DCArtboard>
            <DCArtboard id="s2" label="B · Bibliothèque"   width={360} height={740}><S2_AudioLibrary /></DCArtboard>
            <DCArtboard id="s3" label="C · Samia écoute"   width={360} height={740}><S3_SamiaListening /></DCArtboard>
          </DCSection>

          <DCSection
            id="signbook"
            title="Module 02 · SignBook"
            subtitle="Pour les personnes sourdes. Avatars 3D en langue des signes marocaine, sur chaque icône et chaque livre."
          >
            <DCArtboard id="s4" label="A · Accueil signé"     width={360} height={740}><S4_SignHome /></DCArtboard>
            <DCArtboard id="s5" label="B · Bibliothèque LSM"  width={360} height={740}><S5_SignLibrary /></DCArtboard>
            <DCArtboard id="s6" label="C · Lecture · avatar"  width={360} height={740}><S6_SignReader /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    root.render(<App />);
  </script>
</body>
</html>
