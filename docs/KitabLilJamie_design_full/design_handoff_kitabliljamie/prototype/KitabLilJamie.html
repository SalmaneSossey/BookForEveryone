<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KitabLilJamie — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: 'Geist', system-ui, sans-serif; color: #1B1A17;
      background: radial-gradient(ellipse at 30% 0%, #F0EADD 0%, #E6DFD0 60%, #DDD5C2 100%);
    }
    body { display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    * { box-sizing: border-box; }
    h1, h2, h3, p { margin: 0; }
    button { font-family: inherit; }

    .stage {
      display: flex; align-items: center; gap: 48px;
      width: 100%; max-width: 980px;
    }
    .side {
      flex: 1; max-width: 360px;
    }
    .side .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
      color: #827B6F; margin-bottom: 18px;
    }
    .side h1 {
      font-weight: 400; font-size: 36px; line-height: 1.1;
      letter-spacing: -1.1px; text-wrap: balance;
    }
    .side h1 em { font-style: normal; color: #B8552D; }
    .side p {
      margin-top: 14px; font-size: 14px; line-height: 1.55; color: #4A443B;
      max-width: 280px;
    }
    .crumbs {
      margin-top: 22px; display: flex; flex-direction: column; gap: 8px;
      font-family: 'Geist Mono', monospace; font-size: 11px; color: #6F6960;
    }
    .crumbs .row { display: flex; align-items: center; gap: 8px; }
    .crumbs .dot {
      width: 6px; height: 6px; border-radius: 99px; background: #C9C0AD;
      flex-shrink: 0;
    }
    .crumbs .row.active .dot { background: #B8552D; }
    .crumbs .row.active { color: #1B1A17; }
    .hint {
      margin-top: 28px;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 99px;
      background: rgba(27,26,23,0.05); border: 1px solid rgba(27,26,23,0.08);
      font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.6px;
      color: #4A443B; text-transform: uppercase; cursor: pointer;
    }
    .hint:hover { background: rgba(27,26,23,0.08); }

    .phone-shell { flex-shrink: 0; }

    .screen-stack {
      width: 360px; height: 740px; position: relative; overflow: hidden;
    }
    .screen-stack > .frame {
      position: absolute; inset: 0;
      transition: transform 380ms cubic-bezier(0.4, 0, 0.2, 1), opacity 280ms ease;
    }
    .frame.enter-right { transform: translateX(100%); opacity: 0; }
    .frame.enter-left  { transform: translateX(-100%); opacity: 0; }
    .frame.active      { transform: translateX(0); opacity: 1; }
    .frame.exit-right  { transform: translateX(100%); opacity: 0; }
    .frame.exit-left   { transform: translateX(-100%); opacity: 0; }

    @media (max-width: 820px) {
      .stage { flex-direction: column; gap: 24px; }
      .side { order: 2; max-width: 360px; text-align: left; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="signing-avatar.jsx"></script>
  <script type="text/babel" src="book-covers.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Nav graph (id → {screen, parent})
    const ROUTES = {
      home:      { render: (nav) => <S1_Home nav={nav} />,         parent: null,        crumb: 'Accueil' },
      audioLib:  { render: (nav) => <S2_AudioLibrary nav={nav} />, parent: 'home',      crumb: 'Samia · Bibliothèque' },
      samiaPlay: { render: (nav) => <S3_SamiaListening nav={nav}/>,parent: 'audioLib',  crumb: 'Samia · Écoute' },
      signHome:  { render: (nav) => <S4_SignHome nav={nav} />,     parent: 'home',      crumb: 'SignBook · Accueil' },
      signLib:   { render: (nav) => <S5_SignLibrary nav={nav} />,  parent: 'signHome',  crumb: 'SignBook · Bibliothèque' },
      signRead:  { render: (nav) => <S6_SignReader nav={nav} />,   parent: 'signLib',   crumb: 'SignBook · Lecture' },
    };

    function App() {
      const [stack, setStack] = useState([{ id: 'home', params: {} }]);
      const [transitioning, setTransitioning] = useState(null); // { from, to, dir }

      const current = stack[stack.length - 1];

      const go = (id, params = {}) => {
        if (transitioning || id === current.id) return;
        setTransitioning({ from: current.id, to: id, dir: 'forward' });
        setStack((s) => [...s, { id, params }]);
        setTimeout(() => setTransitioning(null), 420);
      };
      const back = () => {
        if (transitioning || stack.length < 2) return;
        const from = current.id;
        const to = stack[stack.length - 2].id;
        setTransitioning({ from, to, dir: 'back' });
        setStack((s) => s.slice(0, -1));
        setTimeout(() => setTransitioning(null), 420);
      };
      const reset = () => setStack([{ id: 'home', params: {} }]);

      const nav = { go, back, current: current.id, params: current.params };

      // Breadcrumb: path from root → current
      const path = [];
      {
        let cur = current.id;
        while (cur) { path.unshift(cur); cur = ROUTES[cur].parent; }
      }

      // Decide which screens to render: current + any animating-out screen
      const renderables = [];
      if (transitioning) {
        const { from, to, dir } = transitioning;
        const fromEntry = { id: from, params: {} };
        const toEntry = current; // current already updated to target
        renderables.push({
          entry: fromEntry,
          cls: dir === 'forward' ? 'frame exit-left' : 'frame exit-right',
        });
        renderables.push({
          entry: toEntry,
          cls: 'frame active',
          enterFrom: dir === 'forward' ? 'enter-right' : 'enter-left',
        });
      } else {
        renderables.push({ entry: current, cls: 'frame active' });
      }

      return (
        <div className="stage">
          <div className="side">
            <div className="eyebrow">Kitab Lil Jamie · كتاب للجميع</div>
            <h1>Un prototype<br/><em>cliquable.</em></h1>
            <p>Touchez les modules, parcourez la bibliothèque, lancez une lecture. Tout est navigable — pas de mock figé.</p>

            <div className="crumbs">
              {Object.entries(ROUTES).map(([id, r]) => (
                <div key={id} className={'row' + (path.includes(id) ? ' active' : '')}>
                  <span className="dot" />
                  <span>{r.crumb}</span>
                </div>
              ))}
            </div>

            <div className="hint" onClick={reset}>↺ Recommencer</div>
          </div>

          <div className="phone-shell">
            <div className="screen-stack">
              {renderables.map((r, idx) => {
                const scopedNav = { ...nav, params: r.entry.params || {} };
                return (
                  <ScreenFrame
                    key={r.entry.id + '-' + idx}
                    enterFrom={r.enterFrom}
                    cls={r.cls}
                  >
                    {ROUTES[r.entry.id].render(scopedNav)}
                  </ScreenFrame>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function ScreenFrame({ children, enterFrom, cls }) {
      const [klass, setKlass] = useState(enterFrom || cls);
      useEffect(() => {
        if (enterFrom) {
          // tick to next frame, then transition to active
          requestAnimationFrame(() => requestAnimationFrame(() => setKlass(cls)));
        } else {
          setKlass(cls);
        }
      }, [cls, enterFrom]);
      return <div className={klass}>{children}</div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
