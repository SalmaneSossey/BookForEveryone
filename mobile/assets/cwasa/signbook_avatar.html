<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SignBook Avatar Placeholder</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f7fbff;
        font-family: system-ui, sans-serif;
      }
      .avatar {
        width: min(68vw, 280px);
        aspect-ratio: 1;
        border-radius: 24px;
        border: 3px solid #4ecdc4;
        display: grid;
        place-items: center;
        box-shadow: 0 0 36px rgba(78, 205, 196, 0.34);
      }
      .hands {
        font-size: 72px;
        animation: sign 1.1s ease-in-out infinite alternate;
      }
      @keyframes sign {
        from { transform: translateY(10px) rotate(-4deg); }
        to { transform: translateY(-10px) rotate(4deg); }
      }
    </style>
  </head>
  <body>
    <main class="avatar" aria-label="Signing avatar placeholder">
      <div class="hands">🤟</div>
    </main>
    <script>
      window.playSigml = function playSigml(sigml) {
        document.body.dataset.lastSigml = sigml || "";
      };
    </script>
  </body>
</html>
