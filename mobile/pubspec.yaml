name: kitab_lil_jamie
description: Accessible mobile reading MVP for blind, visually impaired, and deaf readers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.0
  go_router: ^14.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  vibration: ^2.0.0
  webview_flutter: ^4.10.0
  dio: ^5.9.2
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/sample_books.json
    - assets/sigml/_index.json
    - assets/sigml/regional_signs/
    - assets/cwasa/signbook_avatar.html
